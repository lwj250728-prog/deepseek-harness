<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<link rel="manifest" href="/__mobile/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/__mobile/icon-192.png" />
<link rel="apple-touch-icon" href="/__mobile/icon-192.png" />
<title>DSH Mobile · 登录</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a26;
    --panel-2: #1a2233;
    --border: #26324a;
    --text: #e8edf6;
    --muted: #8b97ad;
    --accent: #5a6eff;
    --accent-2: #7a8cff;
    --danger: #ff5c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(90,110,255,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(30,120,255,.14), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; max-width: 380px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 20px; padding: 28px 24px 22px;
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 14px;
    background: linear-gradient(135deg, var(--accent), #24345f);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #fff;
    box-shadow: 0 8px 24px rgba(90,110,255,.35);
  }
  h1 { font-size: 20px; text-align: center; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; margin: 6px 0 22px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,110,255,.18); }
  button {
    width: 100%; margin-top: 20px; padding: 13px; font-size: 15px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: 10px; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:active { transform: scale(.985); }
  button:disabled { filter: grayscale(.6) brightness(.8); }
  .error { display: none; margin-top: 14px; padding: 10px 12px; font-size: 13px;
    color: var(--danger); background: rgba(255,92,108,.08);
    border: 1px solid rgba(255,92,108,.3); border-radius: 10px; }
  .error.show { display: block; }
  .hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .hint b { color: var(--text); }
  .hint code { background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 6px; font-size: 11.5px; }
  .foot { margin-top: 16px; text-align: center; color: var(--muted); font-size: 11.5px; }
  .lang { position: fixed; top: 12px; right: 12px; font-size: 12px; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  .zh { display: none; }
  html[lang="en"] .zh { display: none; }
  html[lang="en"] .en { display: block; }
</style>
</head>
<body>
  <div class="lang" id="langToggle">English</div>
  <div class="card">
    <div class="logo">D</div>
    <h1>DSH Mobile</h1>
    <p class="sub en">DeepSeek Harness · 手机访问入口</p>
    <p class="sub zh">DeepSeek Harness · 手机访问入口</p>
    <form id="loginForm" method="post" action="/__mobile/login">
      <label class="en" for="user">用户名（可选，留空则仅用访问令牌）</label>
      <label class="zh" for="user">用户名（可选，留空则仅用访问令牌）</label>
      <input id="user" name="user" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例如 alice" />
      <label for="token">访问令牌</label>
      <input id="token" name="token" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="由网关管理员发放" required />
      <button type="submit" id="submit">登录</button>
    </form>
    <div class="error" id="error">{{ERROR}}</div>
    <div class="hint">
      <b class="en">安装为 App（推荐）</b><b class="zh">安装为 App（推荐）</b><br/>
      <span class="en">登录后：浏览器菜单 →「添加到主屏幕」，即可像 App 一样全屏使用。</span>
      <span class="zh">登录后：浏览器菜单 →「添加到主屏幕」，即可像 App 一样全屏使用。</span>
    </div>
    <div class="foot">gateway v{{VERSION}} · dsh-mobile-gateway</div>
  </div>
<script>
(function () {
  var lang = 'zh-CN';
  try { lang = navigator.language && navigator.language.toLowerCase().indexOf('en') === 0 ? 'en' : 'zh-CN'; } catch (e) {}
  document.documentElement.lang = lang;
  document.getElementById('langToggle').addEventListener('click', function () {
    var next = document.documentElement.lang === 'en' ? 'zh-CN' : 'en';
    document.documentElement.lang = next;
  });
  var error = document.getElementById('error');
  if (error && error.textContent.trim() !== '') error.classList.add('show');
  var form = document.getElementById('loginForm');
  var submit = document.getElementById('submit');
  form.addEventListener('submit', function () { submit.disabled = true; });
  // Register the service worker (secure contexts only; plain HTTP skips it).
  if ('serviceWorker' in navigator && location.protocol.indexOf('https') === 0) {
    navigator.serviceWorker.register('/__mobile/sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
