# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# DCA-PED cognitive pipeline (SAR memory + hot/cold dual-loop learning).
# The pipeline mounts the `ctx.cognitivePipeline` service, seven model-facing
# tools (remember_experience, simulate_experience, reference_experience,
# predict_outcome, report_outcome, rebuild_taxonomy, inspect_memory), and the
# dynamic `cognition:taxonomy` system-prompt section. It degrades to
# deterministic math when no LLM route is configured; set provider/model to
# enable SAR extraction, OOD review, calibration, and reconstruction assists.
- insert:
    - id: cognitive-pipeline
      name: '@deepseek-ai/dsh-cognitive-pipeline'
      config:
        root: !!js dshHomePath('cognitive-pipeline')
        # Reuse the harness's own LLM route (credentials: DEEPSEEK_API_KEY in
        # data/.credentials.yaml); SAR extraction, OOD review, calibration,
        # and reconstruction then run model-assisted.
        provider: deepseek-official
        model: deepseek-v4-flash
        # Real-embedding seam (SiliconFlow bge-m3, OpenAI-compatible): the
        # semantic retrieval channel uses embedding cosine when both sides have
        # vectors; hash-bag cosine remains the fallback. Key in
        # data/.credentials.yaml as SILICONFLOW_API_KEY.
        embedding:
          baseUrl: https://api.siliconflow.cn/v1
          model: BAAI/bge-m3
          apiKeyEnv: SILICONFLOW_API_KEY
        # Automatic accumulation: every completed turn is judged by the LLM
        # route and written as an experience when it deems the episode worth it
        # (pure chat is filtered deterministically before any LLM call).
        autoAccumulate: true
          # Command-execution support for claim audits (verify_claim command
          # anchors): lets the pipeline run a shell command and observe only its
          # exit code. Enabled for F1/F2 fix verification (vitest run).
          # acceptanceCommandExecution: true  ← 启用后重启宿主即可获得 command anchor 通道（配置缩进修正需手动，见 05-improvement-report.md）


    # Main-conversation SAR priming: at every agent pre-step, retrieve
    # situation-related experiences from the pipeline store and inject them as
    # a 【认知经验参考】 block, so the model uses accumulated memory without
    # being told to call predict_outcome. After a failed step it recalls more
    # aggressively (failureThresholdFactor / failureTopK).
    # Must load after cognitive-pipeline (it needs the cognitivePipeline
    # service).
    - id: cognitive-inject
      name: '@deepseek-ai/dsh-cognitive-inject'
      config:
        topK: 1
        minSimilarity: 0.4
        failureThresholdFactor: 0.6
        failureTopK: 3
        contextDepth: 4
        # Main-session pre-input review (M3): before the main model answers a
        # genuine user input, a review subagent (provider 'spawn') synthesizes
        # the retrieved past experience and the analysis is injected back into
        # the main conversation as 【过往经验回顾】.
        review:
          enabled: true

    # Self-scheduled situational state chain: the main-session agent commits
    # periodic situation snapshots (situational_state_commit) and decides the
    # next update time; the latest node is injected at every pre-step as
    # ongoing context. Mounts after cognitive-inject so both primings coexist.
    - id: situational-state
      name: '@deepseek-ai/dsh-situational-state'
      config:
        injectEnabled: true

    # Task-level cognition orchestration: wraps the spawn provider so child
    # prompts receive related SAR experience and settled outcomes are written
    # back. Must load after its delegate (subagent-spawn-in-process).
    - id: cognitive-orchestration
      name: '@deepseek-ai/dsh-cognitive-orchestration'
      config:
        delegate: spawn
        providerName: cognitive
        policyEnabled: true

    # A second subagent tool delegating through the cognitive wrapper, kept
    # separate from the preset-owned `subagent` tool.
    - id: tool-subagent-cognitive
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: cognitive
        toolName: subagent_cognitive
